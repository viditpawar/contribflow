{{- if .Values.grafanaDashboard.enabled }}
# The Grafana sidecar loads any ConfigMap with this label as a dashboard (D18).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "contribflow.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  contribflow.json: |-
    {{- .Files.Get "dashboards/contribflow.json" | nindent 4 }}
{{- end }}
